services:
  web:
    build: .
    container_name: reseachspace-web
    ports:
      - "8082:80"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: reseachspace-database
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: reseachspace
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: